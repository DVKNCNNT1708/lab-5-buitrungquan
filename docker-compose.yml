services:
  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: iot-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iotuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iotpassword}
      POSTGRES_DB: ${POSTGRES_DB:-iotdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - team-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iotuser} -d ${POSTGRES_DB:-iotdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # AI Service
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-ai-service
    environment:
      AI_SERVICE_HOST: ${AI_SERVICE_HOST:-0.0.0.0}
      AI_SERVICE_PORT: ${AI_SERVICE_PORT:-9000}
    ports:
      - "9000:9000"
    networks:
      - team-internal
    command: ["python", "-m", "uvicorn", "src.ai_service.main:app", "--host", "0.0.0.0", "--port", "9000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - db

  # API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-api
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iotuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iotpassword}
      POSTGRES_DB: ${POSTGRES_DB:-iotdb}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      API_SECRET_TOKEN: ${API_SECRET_TOKEN:-lab05-secret-token}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:9000}
    ports:
      - "8000:8000"
    networks:
      - team-internal
    command: ["python", "-m", "uvicorn", "src.iot_app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy

networks:
  team-internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
